<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Inner Peace — Find Your Calm, Understand Your Anxiety</title>
    <meta name="description" content="Inner Peace is a calm, educational space for understanding anxiety and stress — with a guided AI check-in, breathing and relaxation tools, and clear guidance on when professional support may help." />
    <meta name="theme-color" content="#faf7f2" />
    <link rel="canonical" href="https://innerpeace-guide.netlify.app/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Inner Peace — Find Your Calm" />
    <meta property="og:description" content="A calm, educational space for anxiety and stress — a guided AI check-in, breathing and relaxation tools, and clear guidance on when to seek professional support." />
    <meta property="og:url" content="https://innerpeace-guide.netlify.app/" />
    <meta property="og:site_name" content="Inner Peace" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Inner Peace — Find Your Calm" />
    <meta name="twitter:description" content="A calm, educational space for anxiety and stress, with a guided AI check-in and practical tools." />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600;700&family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!--
      Static form for Netlify's build-time form detection. Netlify scans the
      built HTML for forms — it can't see the React-rendered one at runtime —
      so this hidden duplicate must exist with the same name and field names.
      The real, interactive form (Contact.jsx) submits to this via fetch.
    -->
    <form name="contact" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <textarea name="message"></textarea>
      <input type="text" name="bot-field" />
    </form>
  </body>
</html>
